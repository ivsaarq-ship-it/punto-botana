<style>/* id: ui.estilos · tipo: componente_comun · módulo: ui · dependencias: ninguna */
:root{--bg:#fbf7f2;--card:#fff;--txt:#2b1d3a;--sub:#7a6d86;--acc:#6a3fa0;--acc2:#3fae95;--warm:#f5a524;--mal:#d64545;--linea:#eee6dc;--bar:linear-gradient(135deg,#4b2c7f,#3fae95)}
:root[data-theme="dark"]{--bg:#120b1f;--card:#1e1433;--txt:#f5f0ff;--sub:#a79bbd;--acc:#b58cf0;--acc2:#4fd1b0;--warm:#ffc247;--mal:#ff7b7b;--linea:#2e2448;--bar:linear-gradient(135deg,#2a1656,#0f5f52)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;transition:background .3s}
.bar{background:var(--bar);color:#fff;padding:20px 16px 18px;position:relative;overflow:hidden}
.bar:after{content:"";pointer-events:none;position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12);animation:flota 6s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(14px) scale(1.08)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{height:56px;width:56px;border-radius:50%;background:#fff;object-fit:cover}
.sw{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:99px;padding:8px 12px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.bar h1{font-size:22px;font-weight:800;margin-top:10px}.bar small{opacity:.9;font-size:13px}
main{padding:16px;max-width:720px;margin:0 auto}
.tit{font-size:15px;font-weight:800;margin:14px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:block;background:var(--card);border:1px solid var(--linea);border-radius:18px;padding:14px;min-height:96px;color:inherit;text-decoration:none;box-shadow:0 6px 18px rgba(60,30,90,.08);transition:transform .15s}
.card:active{transform:scale(.97)}.card .ic{font-size:22px;margin-bottom:6px}.card b{display:block;font-size:15px}.card span{font-size:12px;color:var(--sub)}
.card.op{background:var(--bar);color:#fff;border:none}.card.op span{color:#eafff8}
.card.off{opacity:.45;pointer-events:none}
form.caja{background:var(--card);border:1px solid var(--linea);border-radius:18px;padding:14px;display:grid;gap:10px}
.campo{display:grid;gap:4px;font-size:13px;color:var(--sub);font-weight:600}
.campo input,.campo select{font:inherit;font-size:16px;color:var(--txt);background:var(--bg);border:1px solid var(--linea);border-radius:12px;padding:11px 12px;width:100%}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;border:none;background:linear-gradient(90deg,var(--warm),#ff7a45);color:#fff;border-radius:14px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;width:100%}
.btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--linea)}
.lista{display:grid;gap:8px;margin-top:4px}
.item{background:var(--card);border:1px solid var(--linea);border-radius:14px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.item small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.item.anulada{opacity:.5;text-decoration:line-through}
.mini{font:inherit;font-size:12px;border:1px solid var(--linea);background:transparent;color:var(--sub);border-radius:99px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.chip{display:inline-block;background:var(--acc2);color:#fff;border-radius:99px;font-size:11px;padding:3px 9px;font-weight:700}
.total{display:flex;justify-content:space-between;font-weight:800;padding:12px 2px}
.vacio{color:var(--sub);font-size:14px;padding:12px 2px}
.aviso{position:fixed;left:16px;right:16px;bottom:20px;padding:14px;border-radius:14px;color:#fff;font-weight:700;background:var(--acc2);box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:9}
.aviso.mal{background:var(--mal)}
.nota{font-size:12px;color:var(--sub);margin-top:10px}

// ── core.datos (core/datos.js)
// id: core.datos · tipo: proceso_base · módulo: core · dependencias: config.negocio
// Guardar y leer. Los movimientos (compras, gastos, ventas) solo se agregan: nunca se editan ni se borran.
(function (g) {
  const PB = (g.PB = g.PB || {});

  function adaptadorSupabase(url, clave) {
    const cli = g.supabase.createClient(url, clave);
    const r = async (p) => { const { data, error } = await p; if (error) throw new Error(error.message); return data; };
    return {
      listar: (tabla, orden) => r(cli.from(tabla).select('*').order(orden || 'creado_en', { ascending: false })),
      agregar: async (tabla, fila) => (await r(cli.from(tabla).insert(fila).select()))[0],
      actualizar: async (tabla, id, cambios) => (await r(cli.from(tabla).update(cambios).eq('id', id).select()))[0],
      entrar: async (correo, clave) => { const d = await r(cli.auth.signInWithPassword({ email: correo, password: clave })); return d.user; },
      salir: () => cli.auth.signOut(),
      usuario: async () => (await cli.auth.getUser()).data.user || null,
    };
  }

  let adaptador = null;
  PB.datos = {
    iniciar(url, clave) {
      adaptador = g.__REPO_FALSO__ || adaptadorSupabase(url, clave);
    },
    listar(tabla, orden) { return adaptador.listar(tabla, orden); },
    agregar(tabla, fila) { return adaptador.agregar(tabla, fila); },
    actualizar(tabla, id, cambios) {
      if (PB.config.tablasMovimiento.includes(tabla)) {
        return Promise.reject(new Error('Los movimientos no se editan. Usa una anulación.'));
      }
      return adaptador.actualizar(tabla, id, cambios);
    },
    entrar(correo, clave) { return adaptador.entrar(correo, clave); },
    salir() { return adaptador.salir(); },
    usuario() { return adaptador.usuario(); },
  };
})(typeof window !== 'undefined' ? window : globalThis);

// Botón día / noche. Se recuerda en el teléfono si se puede.
(function (g) {
  const PB = (g.PB = g.PB || {});
  const leer = () => { try { return localStorage.getItem('pb_tema'); } catch (e) { return null; } };
  const guardar = (v) => { try { localStorage.setItem('pb_tema', v); } catch (e) { /* sin memoria local */ } };
  PB.tema = {
    actual: () => document.documentElement.dataset.theme || 'light',
    aplicar(v) { document.documentElement.dataset.theme = v; },
    iniciar() { this.aplicar(leer() || 'light'); },
    alternar() {
      const v = this.actual() === 'dark' ? 'light' : 'dark';
      this.aplicar(v); guardar(v);
      document.querySelectorAll('.bar .sw[type=button]').forEach((b) => (b.textContent = this.etiqueta()));
    },
    etiqueta() { return this.actual() === 'dark' ? '☀ Día' : '☾ Noche'; },
  };
})(typeof window !== 'undefined' ? window : globalThis);

})(typeof window !== 'undefined' ? window : globalThis);

      const cantidad = h('input', { type: 'number', name: 'cantidad', step: 'any', min: '0', inputmode: 'decimal', placeholder: '0' });
      const unidad = h('select', { name: 'unidad' });
      const precio = h('input', { type: 'number', name: 'precio', step: 'any', min: '0', inputmode: 'decimal', placeholder: '$0.00' });
      const notas = h('input', { name: 'notas', placeholder: 'Ej. nota 0806' });
      const lista = h('div', { class: 'lista' });
      const total = h('div', { class: 'total' });

      const llenarUnidades = () => {
        const i = porId[insumo.value];
        unidad.replaceChildren(...(i ? U.paraBase(i.unidad_base) : []).map((u) => h('option', { value: u }, u)));
      };
      insumo.addEventListener('change', llenarUnidades);

      async function pintar() {
        const compras = await PB.datos.listar('compras', 'fecha');
        const visibles = compras.filter((c) => !c.anula_id);
        const hoyStr = hoy();
        total.replaceChildren(h('span', {}, 'Total de hoy'), h('span', {}, dinero(R.total(compras, hoyStr, hoyStr))));
        lista.replaceChildren(...(visibles.length ? visibles.slice(0, 50).map((c) => {
          const i = porId[c.insumo_id] || { nombre: '¿?', unidad_base: 'pieza' };
          const anulada = R.estaAnulada(c, compras);
          return h('div', { class: 'item' + (anulada ? ' anulada' : '') },
            h('div', {}, h('b', {}, i.nombre + ' · ' + dinero(c.precio_total)),
              h('small', {}, c.fecha + ' · ' + (provId[c.proveedor_id] ? provId[c.proveedor_id].nombre : 'Sin proveedor') +
                ' · ' + dinero(R.precioUnitario(c, i.unidad_base)) + ' por ' + U.nombreVenta(i.unidad_base) + (c.notas ? ' · ' + c.notas : ''))),
            anulada ? h('span', { class: 'chip' }, 'Anulada') : h('button', { class: 'mini', type: 'button', onclick: async () => {
              if (!confirm('¿Anular esta compra? Queda registrada como anulada.')) return;
              try { await PB.datos.agregar('compras', R.anulacion(c)); aviso('Compra anulada'); pintar(); }
              catch (e) { aviso('No se anuló: ' + e.message, 'mal'); }
            } }, 'Anular'));
        }) : [h('p', { class: 'vacio' }, 'Aún no hay compras.')]));
      }

      const form = h('form', { class: 'caja', onsubmit: async (ev) => {
        ev.preventDefault();
        const i = porId[insumo.value];
        let base;
        try { base = i ? U.aBase(cantidad.value, unidad.value) : 0; } catch (e) { return aviso(e.message, 'mal'); }
        const fila = { fecha: fecha.value, insumo_id: insumo.value || null, proveedor_id: prov.value || null,
          cantidad: base, precio_total: precio.value === '' ? '' : Number(precio.value), notas: notas.value.trim() || null };
        const errores = PB.esquemas.compra.validar(fila);
        if (errores.length) return aviso(errores.join('. '), 'mal');
        try {
          await PB.datos.agregar('compras', fila);
          PB.eventos.emitir('compra:agregada', fila);
          cantidad.value = ''; precio.value = ''; notas.value = '';
          aviso('Compra guardada'); pintar();
        } catch (e) { aviso('No se guardó: ' + e.message, 'mal'); }
      } },
      campo('Fecha', fecha), campo('Insumo', insumo), campo('Proveedor', prov),
      h('div', { class: 'fila2' }, campo('Cantidad', cantidad), campo('Unidad', unidad)),
      campo('Precio total pagado', precio), campo('Notas', notas),
      h('button', { class: 'btn' }, 'Guardar compra'));

      cont.replaceChildren(encabezado('Compras', 'Registrar lo que se compró', true),
        h('main', {}, activos.length ? form : h('p', { class: 'vacio' }, 'Primero da de alta insumos.'),
          total, h('div', { class: 'tit' }, 'Últimas compras'), lista,
          h('p', { class: 'nota' }, 'Las compras no se editan ni se borran: se anulan y quedan registradas.')));
      await pintar();
    },
  };
})(typeof window !== 'undefined' ? window : globalThis);

// ── insumos.esquema (modules/insumos/esquema/insumo.js)
// id: insumos.esquema · tipo: dato · módulo: insumos · dependencias: ninguna
(function (g) {
  const PB = (g.PB = g.PB || {});
  PB.esquemas = PB.esquemas || {};
  PB.esquemas.insumo = {
    tabla: 'insumos',
    campos: { nombre: 'texto, obligatorio', unidad_base: 'g | ml | pieza', activo: 'sí/no' },
    validar(f) {
      const e = [];
      if (!f.nombre || !String(f.nombre).trim()) e.push('Falta el nombre');
      if (!['g', 'ml', 'pieza'].includes(f.unidad_base)) e.push('Unidad base inválida');
      return e;
    },
  };
  if (typeof module !== 'undefined') module.exports = PB.esquemas.insumo;
})(typeof window !== 'undefined' ? window : globalThis);

// ── insumos.pantalla (modules/insumos/pantalla/insumos.js)
// id: insumos.pantalla · tipo: pantalla · módulo: insumos · dependencias: core.datos, ui.comunes, insumos.esquema
(function (g) {
  const PB = (g.PB = g.PB || {});
  PB.pantallas = PB.pantallas || {};
  const BASES = { g: 'Peso (se compra en kg o g)', ml: 'Volumen (litros o ml)', pieza: 'Piezas (pieza, paquete, cartón)' };
  PB.pantallas.insumos = {
    ruta: 'insumos', titulo: 'Insumos', icono: '🦐', desc: 'Lo que se usa para preparar',
    async mostrar(cont) {
      const { h, campo, aviso, encabezado } = PB.ui;
      const nombre = h('input', { name: 'nombre', placeholder: 'Ej. Camarón crudo', required: true });
      const base = h('select', { name: 'unidad_base' }, Object.entries(BASES).map(([v, t]) => h('option', { value: v }, t)));
      const lista = h('div', { class: 'lista' });

      async function pintar() {
        const filas = await PB.datos.listar('insumos', 'nombre');
        lista.replaceChildren(...(filas.length ? filas.map((i) => h('div', { class: 'item' + (i.activo ? '' : ' anulada') },
          h('div', {}, h('b', {}, i.nombre), h('small', {}, BASES[i.unidad_base])),
          h('button', { class: 'mini', type: 'button', onclick: async () => {
            await PB.datos.actualizar('insumos', i.id, { activo: !i.activo });
            aviso(i.activo ? 'Insumo desactivado' : 'Insumo activado'); pintar();
          } }, i.activo ? 'Desactivar' : 'Activar'))) : [h('p', { class: 'vacio' }, 'Aún no hay insumos.')]));
      }

      const form = h('form', { class: 'caja', onsubmit: async (ev) => {
        ev.preventDefault();
        const fila = { nombre: nombre.value.trim(), unidad_base: base.value };
        const errores = PB.esquemas.insumo.validar(fila);
        if (errores.length) return aviso(errores.join('. '), 'mal');
        try {
          await PB.datos.agregar('insumos', fila);
          PB.eventos.emitir('insumo:agregado', fila);
          form.reset(); aviso('Insumo guardado'); pintar();
        } catch (e) { aviso('No se guardó: ' + e.message, 'mal'); }
      } }, campo('Nombre', nombre), campo('Se mide por', base), h('button', { class: 'btn' }, 'Guardar insumo'));

      cont.replaceChildren(encabezado('Insumos', 'Lo que se usa para preparar', true),
        h('main', {}, form, h('div', { class: 'tit' }, 'Lista'), lista,
          h('p', { class: 'nota' }, 'Los insumos no se borran: se desactivan.')));
      await pintar();
    },
  };
})(typeof window !== 'undefined' ? window : globalThis);

(function (g) {
  const PB = (g.PB = g.PB || {});

  PB.pantallas.proveedores = {
    ruta: 'proveedores', titulo: 'Proveedores', icono: '🚚', desc: 'Quién nos surte',

      const lista = h('div', { class: 'lista' });

      async function pintar() {
        const filas = await PB.datos.listar('proveedores', 'nombre');
        lista.replaceChildren(...(filas.length ? filas.map((p) => h('div', { class: 'item' + (p.activo ? '' : ' anulada') },
          h('div', {}, h('b', {}, p.nombre), h('small', {}, p.contacto || 'Sin contacto')),
          h('button', { class: 'mini', type: 'button', onclick: async () => {
            await PB.datos.actualizar('proveedores', p.id, { activo: !p.activo });
            aviso(p.activo ? 'Proveedor desactivado' : 'Proveedor activado'); pintar();
          } }, p.activo ? 'Desactivar' : 'Activar'))) : [h('p', { class: 'vacio' }, 'Aún no hay proveedores.')]));
      }

      const form = h('form', { class: 'caja', onsubmit: async (ev) => {

        const errores = PB.esquemas.proveedor.validar(fila);
        if (errores.length) return aviso(errores.join('. '), 'mal');
        try {
          await PB.datos.agregar('proveedores', fila);
          PB.eventos.emitir('proveedor:agregado', fila);
          form.reset(); aviso('Proveedor guardado'); pintar();
        } catch (e) { aviso('No se guardó: ' + e.message, 'mal'); }

      cont.replaceChildren(encabezado('Proveedores', 'Quién nos surte', true),
        h('main', {}, form, h('div', { class: 'tit' }, 'Lista'), lista,

})(typeof window !== 'undefined' ? window : globalThis);

// Entrada: carga core y módulos, pide clave/sesión y muestra la pantalla según la dirección (#/compras, etc.).
(function (g) {
  const PB = g.PB;
  const { h, campo, aviso, encabezado } = PB.ui;
  const app = document.getElementById('app');
  const PROXIMAMENTE = [
    { icono: '🧾', titulo: 'Comandero', desc: 'Tomar orden y mandar a cocina' },
    { icono: '📈', titulo: 'Ventas', desc: 'Hoy y calendario' },
    { icono: '💸', titulo: 'Gastos', desc: 'Renta, luz, gasolina' },
    { icono: '🧮', titulo: 'Costo directo', desc: 'Costo y precio mínimo' },
  ];

  const leerClave = () => { try { return localStorage.getItem('pb_anon') || ''; } catch (e) { return ''; } };
  const claveAnon = () => PB.config.supabaseAnonKey || leerClave();

  function pantallaClave() {
    const k = h('input', { name: 'clave', placeholder: 'Pega aquí la clave anon', required: true });
    app.replaceChildren(encabezado(PB.config.nombreApp, PB.config.subtitulo), h('main', {},
      h('form', { class: 'caja', onsubmit: (ev) => {
        ev.preventDefault();
        try { localStorage.setItem('pb_anon', k.value.trim()); } catch (e) { return aviso('Este teléfono no guarda datos', 'mal'); }
        location.reload();
      } }, h('p', {}, 'Primera vez en este teléfono: pega la clave anon de Supabase (Project Settings → API).'),
      campo('Clave anon', k), h('button', { class: 'btn' }, 'Guardar'))));
  }

  function pantallaEntrar() {
    const correo = h('input', { type: 'email', name: 'correo', autocomplete: 'username', required: true });
    const clave = h('input', { type: 'password', name: 'clave', autocomplete: 'current-password', required: true });
    app.replaceChildren(encabezado(PB.config.nombreApp, PB.config.subtitulo), h('main', {},
      h('form', { class: 'caja', onsubmit: async (ev) => {
        ev.preventDefault();
        try { await PB.datos.entrar(correo.value.trim(), clave.value); ruta(); }
        catch (e) { aviso('No se pudo entrar: ' + e.message, 'mal'); }
      } }, campo('Correo', correo), campo('Contraseña', clave), h('button', { class: 'btn' }, 'Entrar'))));
  }

  function inicio() {
    const activos = ['compras', 'insumos', 'proveedores'].map((k) => PB.pantallas[k]);
    app.replaceChildren(encabezado('Hola', PB.config.nombreApp + ' ' + PB.config.subtitulo), h('main', {},
      h('div', { class: 'tit' }, '¿Qué quieres hacer?'),
      h('div', { class: 'grid' },
        activos.map((p, n) => h('a', { class: 'card' + (n === 0 ? ' op' : ''), href: '#/' + p.ruta },
          h('div', { class: 'ic' }, p.icono), h('b', {}, p.titulo), h('span', {}, p.desc))),
        PROXIMAMENTE.map((p) => h('div', { class: 'card off' }, h('div', { class: 'ic' }, p.icono), h('b', {}, p.titulo), h('span', {}, 'Próximamente')))),
      h('button', { class: 'btn sec', style: 'margin-top:16px', type: 'button', onclick: async () => { await PB.datos.salir(); ruta(); } }, 'Salir'),
      h('p', { class: 'nota' }, 'Versión ' + PB.config.version)));
  }

  async function ruta() {
    if (!(await PB.datos.usuario())) return pantallaEntrar();
    const nombre = (location.hash.replace('#/', '') || 'inicio');
    const p = PB.pantallas[nombre];
    try { p ? await p.mostrar(app) : inicio(); scrollTo(0, 0); }
    catch (e) { aviso('Error: ' + e.message, 'mal'); }
  }

  PB.tema.iniciar();
  if (!g.__REPO_FALSO__ && !claveAnon()) { pantallaClave(); return; }
  PB.datos.iniciar(PB.config.supabaseUrl, claveAnon());
  addEventListener('hashchange', ruta);
  ruta();
})(window);
</script>
