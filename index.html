<style>/* id: ui.estilos · tipo: componente_comun · módulo: ui · dependencias: ninguna
   Diseño Punto Botana: azul marino y naranja del logo, fondo crema, Fraunces + Inter. */
:root{--bg:#FFF7EC;--card:#fff;--txt:#13224B;--sub:#6B6359;--linea:#EFE4D3;--suave:#FFF7EC;--navy:#13224B;--navy2:#1E3166;--navyLinea:#3A4F8F;--naranja:#F26B1F;--boton:#C9480B;--botonTxt:#fff;--verde:#0F766E;--verdeTxt:#0F5F57;--verdeSuave:#E6F4F1;--naranjaTxt:#A63A06;--naranjaSuave:#FDE7D8;--azulSuave:#E3E8F6;--mal:#B42318;--sombra:0 6px 16px rgba(19,34,75,.08)}
:root[data-theme="dark"]{--bg:#0B1430;--card:#16224A;--txt:#F4F1EA;--sub:#A9B2CC;--linea:#24315F;--suave:#111C3D;--navy:#060D24;--navy2:#16224A;--navyLinea:#2E3D70;--verdeTxt:#6EE7C8;--verdeSuave:#0E2F2C;--naranjaTxt:#F9A66C;--naranjaSuave:#3A2416;--azulSuave:#1C2A58;--mal:#FF8A80;--sombra:0 6px 16px rgba(0,0,0,.3)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.serif,.bar h1,.num{font-family:Fraunces,Georgia,serif;font-weight:800}
/* Encabezado */
.bar{background:var(--navy);color:#FFF7EC;padding:14px 16px 16px}
.bar-top{display:flex;align-items:center;gap:12px}
.bar-tit{flex:1;min-width:0;display:flex;flex-direction:column}
.bar h1{font-size:21px;line-height:1.15}
.bar small{font-size:12.5px;color:#C9D2EA}
.circ{flex:none;width:44px;height:44px;border-radius:22px;border:1px solid var(--navyLinea);background:var(--navy2);color:#FFF7EC;display:grid;place-items:center;text-decoration:none}
.logo{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--naranja);background:#fff}
main{padding:16px;max-width:760px;margin:0 auto}
.tit{font-size:13px;font-weight:800;color:var(--sub);letter-spacing:.04em;text-transform:uppercase;margin:18px 2px 10px}
/* Inicio */
.saludo{padding:4px 0 60px}
.saludo span{font-size:13px;color:#C9D2EA}.saludo b{display:block;font-family:Fraunces,Georgia,serif;font-size:28px;line-height:1.15;margin-top:2px}
.hoy{margin:-58px 16px 0;background:var(--card);border-radius:22px;padding:18px;box-shadow:0 12px 30px rgba(19,34,75,.16);display:grid;gap:14px;position:relative}
.hoy-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hoy-top span{font-size:13px;color:var(--sub);font-weight:600}.hoy-top .num{display:block;font-size:34px;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:6px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.sube{background:var(--verdeSuave);color:var(--verdeTxt)}.pill.baja{background:var(--naranjaSuave);color:var(--naranjaTxt)}.pill.neutro{background:var(--azulSuave);color:var(--txt)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--suave);border-radius:14px;padding:10px;display:grid;gap:2px}.stats span{font-size:12px;color:var(--sub)}.stats b{font-size:18px}
.cta{margin:16px 0 0;background:var(--boton);color:var(--botonTxt);border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:14px;text-decoration:none;box-shadow:0 12px 24px rgba(201,72,11,.28)}
.cta .ic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.cta b{display:block;font-size:18px}.cta span{font-size:13px;opacity:.92}.cta .crece{flex:1}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--linea);border-radius:18px;padding:14px 10px;min-height:96px;display:flex;flex-direction:column;gap:10px;color:var(--txt);text-decoration:none;box-shadow:var(--sombra);transition:transform .12s}
.tile:active,.prod:active,.cta:active{transform:scale(.97)}
.tile b{font-size:13.5px}
.ic-n,.ic-v,.ic-a{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.ic-n{background:var(--naranjaSuave);color:var(--naranjaTxt)}.ic-v{background:var(--verdeSuave);color:var(--verdeTxt)}.ic-a{background:var(--azulSuave);color:var(--txt)}
/* Formularios y listas */
.caja{background:var(--card);border:1px solid var(--linea);border-radius:20px;padding:14px;display:grid;gap:12px;box-shadow:var(--sombra)}
.campo{display:grid;gap:5px;font-size:13px;color:var(--sub);font-weight:700}
.campo input,.campo select,.entrada{font-size:16px;color:var(--txt);background:var(--suave);border:1px solid var(--linea);border-radius:14px;padding:12px 14px;width:100%;min-height:48px}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:none;background:var(--boton);color:var(--botonTxt);border-radius:16px;min-height:52px;padding:12px 16px;font-weight:800;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}

.cuenta{position:absolute;top:8px;right:8px;min-width:30px;height:30px;border-radius:15px;background:var(--boton);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;box-shadow:0 0 0 3px var(--card);animation:pop .18s ease-out}

.total-grande{display:flex;justify-content:space-between;align-items:baseline}.total-grande .num{font-size:32px}
/* Cocina (siempre oscura) */
.kds{--card:#16224A;--txt:#F4F1EA;--sub:#A9B2CC;--linea:#24315F;background:#0B1430;color:#F4F1EA;min-height:100vh}

.ped.nuevo .btn{background:#F26B1F;color:#13224B}.ped.en_cocina .btn{background:#9DB4FF;color:#0B1430}.ped.listo .btn{background:#6EE7C8;color:#0B1430}
/* Ventas */
.periodo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--card);border:1px solid var(--linea);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}

.barras{display:flex;gap:4px;align-items:flex-end;height:130px}

.top{display:grid;gap:10px;background:var(--card);border:1px solid var(--linea);border-radius:20px;padding:12px 14px}

.barra-sel{position:fixed;left:12px;right:12px;bottom:16px;max-width:600px;margin:0 auto;background:var(--navy);color:#FFF7EC;border-radius:18px;padding:10px;display:flex;gap:8px;align-items:center;z-index:25;box-shadow:0 12px 26px rgba(0,0,0,.3)}

.bar{position:relative;background:linear-gradient(180deg,#13224B 0%,#164A84 70%,#1A6FA0 100%);margin-bottom:22px}
:root[data-theme="dark"] .bar{background:linear-gradient(180deg,#060D24 0%,#0D2A55 70%,#1A6FA0 100%)}
.bar::after,.bar::before{content:"";position:absolute;left:0;right:0;pointer-events:none;background-repeat:repeat-x;background-size:200px 24px}
.bar::after{bottom:-22px;height:24px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%2024%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20d%3D%22M0%200%20H200%20V10%20C175%2022%20150%2022%20125%2012%20S75%200%2050%2010%20S25%2022%200%2012Z%22%20fill%3D%22%231A6FA0%22%2F%3E%3C%2Fsvg%3E");animation:olas 14s linear infinite}
.bar::before{bottom:-14px;height:24px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%2024%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20d%3D%22M0%200%20H200%20V14%20C170%204%20150%204%20125%2014%20S80%2024%2050%2014%20S20%204%200%2014Z%22%20fill%3D%22%232E9DC4%22%20opacity%3D%22.7%22%2F%3E%3C%2Fsvg%3E");animation:olas 9s linear infinite reverse;z-index:0}
@keyframes olas{to{background-position-x:200px}}
@media (prefers-reduced-motion:reduce){.bar::after,.bar::before{animation:none}}
.hoy{margin-top:-46px}
/* Textos fuera de tarjetas: con fondo para que no se pierdan sobre la playa */
main .tit,main>.total,main>.nota,main .vacio{background:rgba(255,250,240,.88);border-radius:12px;padding:8px 12px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
main .tit{display:inline-block;margin-top:16px}.caja .tit,.hoja .tit{background:none;backdrop-filter:none;padding:0}
main>.total{padding:12px 14px;margin:12px 0}
:root[data-theme="dark"] main .tit,:root[data-theme="dark"] main>.total,:root[data-theme="dark"] main>.nota,:root[data-theme="dark"] main .vacio{background:rgba(11,20,48,.85)}
.cat{background:transparent}
.cat button:not(.on){background:rgba(255,255,255,.92)}
.kds{background:transparent!important}


.receta-fila{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px 40px;gap:6px;align-items:center}
.receta-fila input{min-height:42px;border-radius:10px;border:1px solid var(--linea);background:var(--suave);padding:6px 8px;font-size:15px;width:100%;color:var(--txt)}
.receta-fila.falta input{border-color:var(--naranja);background:var(--naranjaSuave)}
.receta-fila.cab span{font-size:12px;color:var(--sub);font-weight:700}
.receta-fila .mini{min-height:40px;padding:0;display:grid;place-items:center}
.mini-foto{width:40px;height:40px;border-radius:12px;font-size:13px;flex:none}
.cta .ic{position:relative}.cta-cuenta{position:absolute;top:-8px;right:-8px;min-width:26px;height:26px;border-radius:13px;background:#F26B1F;color:#13224B;font-weight:800;font-size:14px;display:grid;place-items:center;box-shadow:0 0 0 3px var(--verde);animation:pop .2s}
:root[data-theme="dark"] .cat button:not(.on){background:rgba(22,34,74,.92);color:#F4F1EA;border-color:#2E3D70}
.menos-btn{position:absolute;right:8px;top:46px;width:34px;height:34px;border-radius:17px;background:#fff;color:#B42318;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.quitar-todo{border:0;background:transparent;color:#B42318;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px;padding:6px 0 0;min-height:32px}
/* Aviso de pedido listo: contorno rojo que brilla hasta que lo tocan */
.listo-aviso{border:3px solid #FF3B30;animation:brilloRojo .8s ease-in-out infinite alternate}
@keyframes brilloRojo{from{box-shadow:0 0 0 0 rgba(255,59,48,.95),0 14px 30px rgba(0,0,0,.35)}to{box-shadow:0 0 22px 8px rgba(255,59,48,.85),0 14px 30px rgba(0,0,0,.35)}}
.kds main .vacio,.kds main .tit,.kds main>.nota{background:rgba(11,20,48,.85);color:#F4F1EA}

.caja-cal{background:rgba(255,250,240,.92);border-radius:20px;padding:12px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
:root[data-theme="dark"] .caja-cal{background:rgba(11,20,48,.88)}
.item.marcada{border-color:var(--naranja);background:var(--naranjaSuave)}

/* Cuenta de mesa */
.cta.azul{background:#1D4E89;box-shadow:0 12px 24px rgba(29,78,137,.28);margin-top:12px}
.cta-linea{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cta-det{display:grid;gap:2px;margin-top:6px;font-size:13px;color:var(--sub)}
.cta-persona{text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer}
.cta-totales{display:grid;gap:6px;margin:14px 0 10px;padding:14px;border-radius:16px;background:var(--suave)}

/* Cuentas separadas en el comandero */
.personas{margin-top:10px;display:grid;gap:6px}
.pers-tit{font-size:12px;font-weight:700;color:#FFF7EC;opacity:.85;letter-spacing:.02em}
.personas small{color:#FFF7EC;opacity:.85;font-size:12px}
.pers-fila{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;align-items:center}
.pers-fila::-webkit-scrollbar{display:none}
.pers{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--navyLinea);background:transparent;color:#FFF7EC;font-weight:700;font-size:14px}
.pers.on{background:#FFF7EC;color:#13224B;border-color:#FFF7EC}
.pers i{font-style:normal;background:var(--naranja);color:#13224B;border-radius:99px;min-width:20px;height:20px;display:inline-grid;place-items:center;font-size:12px;padding:0 5px}
.pers.mas{width:38px;padding:0;justify-content:center}
.pers.pers-cta{background:#1D4E89;border-color:#1D4E89}
.pers-in{flex:none;width:110px;min-height:38px;border-radius:99px;border:1px solid var(--navyLinea);background:rgba(255,247,236,.08);color:#FFF7EC;padding:0 12px;font:inherit;font-size:14px}
.pers-in::placeholder{color:#FFF7EC;opacity:.6}
.pers-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pers-top .pers.pers-cta{min-height:32px;font-size:13px}
.mini-seg{margin:0;flex:1;max-width:330px}
.mini-seg button{min-height:36px;font-size:13px}
.pers.listo{background:var(--verde);border-color:var(--verde)}

/* Cuadro «En cocina» del inicio: abre Cocina; con pedidos, fondo verde azulado y marco naranja parpadeante */
.stats a.stat-cocina{margin-top:-36px;align-content:center;background:var(--suave);border-radius:14px;padding:10px;display:grid;gap:2px;text-decoration:none;color:inherit;border:2px solid transparent}
.stats a.stat-cocina span{font-size:12px;color:var(--sub)}
.stats a.stat-cocina b.en-cocina{color:#F26B1F;font-size:48px;line-height:1.1;text-align:center}
.stats a.stat-cocina.con{background:rgba(15,118,110,.16);animation:marcoNaranja 1.2s ease-in-out infinite}
@keyframes marcoNaranja{0%,100%{border-color:#F26B1F;box-shadow:0 0 10px rgba(242,107,31,.55)}50%{border-color:rgba(242,107,31,.15);box-shadow:none}}
@media (prefers-reduced-motion:reduce){.stats a.stat-cocina.con{animation:none;border-color:#F26B1F}}

/* Inicio del mesero: dos mitades */
.mitades{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mitad{border:2px solid transparent;background:var(--suave);border-radius:16px;padding:12px;display:grid;gap:4px;text-align:center;text-decoration:none;color:inherit;font:inherit;cursor:pointer}
.mitad span{font-size:13px;color:var(--sub);font-weight:600}
.mitad b{font-size:48px;line-height:1.05}
.mitad.cocina b{color:#F26B1F}
.mitad.listos b{color:#0F9488}
.mitad.cocina.con{background:rgba(15,118,110,.16);animation:marcoNaranja 1.2s ease-in-out infinite}
.mitad.listos.con{background:rgba(15,148,136,.14);border-color:#0F9488}
@media (prefers-reduced-motion:reduce){.mitad.cocina.con{animation:none;border-color:#F26B1F}}
.pers.mas{background:var(--naranja);border-color:var(--naranja);color:#13224B;width:44px;min-height:44px}
.cta.corte{background:#5B3E96;box-shadow:0 12px 24px rgba(91,62,150,.28);margin-top:12px}

.stats a.stat-link{background:var(--suave);border-radius:14px;padding:10px;display:grid;gap:2px;text-decoration:none;color:inherit}
.stats a.stat-link span{font-size:12px;color:var(--sub)}.stats a.stat-link b{font-size:18px}
.ventas-per{grid-template-columns:repeat(4,minmax(0,1fr))}.ventas-per .fecha-sel{grid-column:1/-1}
.fecha-sel{min-height:36px;border-radius:10px;border:1px solid var(--linea);background:var(--suave);color:inherit;font:inherit;font-size:13px;padding:0 8px}
.fecha-sel.on{border-color:var(--naranja);box-shadow:0 0 0 2px var(--naranja) inset}

/* Revisión: textos largos no rompen la pantalla; contraste; notas legibles sobre la foto */
.renglon,.cta-linea,.franja,.ped-item,.aviso,.hero,.cta-totales{overflow-wrap:anywhere;min-width:0}
.cta-linea>*{min-width:0}
.caja-nota{background:var(--card);border-radius:12px;padding:10px 12px}
:root[data-theme="dark"] .quitar-todo{color:#FF8A7A}
.hoja{max-width:100%;box-sizing:border-box}
</style>

(function (g) {
  const PB = (g.PB = g.PB || {});
  const r2 = (n) => Math.round(n * 100) / 100;
  const anuladasIds = (filas) => new Set(filas.filter((f) => f.anula_id).map((f) => f.anula_id));
  PB.movimientos = {
    vigentes(filas) {
      const fuera = anuladasIds(filas);
      return filas.filter((f) => !f.anula_id && !fuera.has(f.id));
    },
    estaAnulada: (fila, filas) => anuladasIds(filas).has(fila.id),
    anulacion(fila, campos, motivo) {
      const nueva = {};
      campos.forEach((c) => (nueva[c] = fila[c]));
      nueva.anula_id = fila.id;
      nueva.notas = 'Anulación' + (motivo ? ': ' + motivo : '');
      return nueva;
    },
    total(filas, campo, desde, hasta) {
      return r2(this.vigentes(filas)

    esSinCorreo() { return adaptador.esSinCorreo(); },

      el.addEventListener('click', (ev) => { if (el.dataset.largo) { delete el.dataset.largo; ev.stopImmediatePropagation(); ev.preventDefault(); } }, true);
      el.addEventListener('contextmenu', (ev) => ev.preventDefault());
      return el;
    },
    // Confirmación con botones claros (sin el «Cancelar/Aceptar» del teléfono, que confunde).
    confirmar(texto, si, no) {
      return new Promise((resolver) => {
        const cerrar = (r) => { v.remove(); resolver(r); };
        const v = h('div', { class: 'velo', onclick: (ev) => ev.target === v && cerrar(false) },
          h('section', { class: 'hoja', role: 'alertdialog', 'aria-modal': 'true', style: 'max-width:520px' },
            h('b', { class: 'serif', style: 'font-size:20px' }, texto),
            h('button', { type: 'button', class: 'btn', style: 'background:#B42318', onclick: () => cerrar(true) }, si || 'Sí'),
            h('button', { type: 'button', class: 'btn sec', onclick: () => cerrar(false) }, no || 'No, regresar')));
        document.body.append(v);
      });
    },
    // Foto en grande (para enseñarla al cliente). extra: botones opcionales abajo.
    verFoto(url, nombre, extra) {
      const cerrar = () => v.remove();
      const v = h('div', { class: 'visor', role: 'dialog', 'aria-modal': 'true', 'aria-label': nombre || 'Foto', onclick: (ev) => ev.target === v && cerrar() },
        h('button', { type: 'button', class: 'circ visor-x', 'aria-label': 'Cerrar', onclick: cerrar }, icono('cerrar')),
        h('img', { src: url, alt: nombre || '' }), nombre ? h('b', { class: 'serif' }, nombre) : null, extra || null);
      document.body.append(v);
      return cerrar;
    },
    // Nombre de archivo único para una foto: carpeta/fecha-aleatorio.ext
    rutaFoto(prefijo, archivo) {
      const ext = ((archivo && archivo.name) || 'foto.jpg').split('.').pop().toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
      return `${prefijo}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    },
    botonTema() {
      const oscuro = PB.tema.actual() === 'dark';
      return h('button', { class: 'circ tema', type: 'button', 'aria-label': oscuro ? 'Cambiar a modo día' : 'Cambiar a modo noche', onclick: () => PB.tema.alternar() },
        icono(oscuro ? 'sol' : 'luna'));
    },

  function pantallaClave() {
    const k = h('input', { class: 'entrada', name: 'clave', placeholder: 'Pega aquí la clave anon', required: true });
    app.replaceChildren(encabezadoMarca(PB.config.subtitulo), h('main', {},
      h('form', { class: 'caja', onsubmit: (ev) => {
        ev.preventDefault();
        try { localStorage.setItem('pb_anon', k.value.trim()); } catch (e) { return aviso('Este teléfono no guarda datos', 'mal'); }
        location.reload();
      } }, h('p', {}, 'Primera vez en este teléfono: pega la clave anon de Supabase (Project Settings → API).'),
      campo('Clave anon', k), h('button', { class: 'btn' }, 'Guardar'))));
  }

  const leerCodigo = () => { try { return localStorage.getItem('pb_codigo') || ''; } catch (e) { return ''; } };
  const guardarCodigo = (c) => { try { localStorage.setItem('pb_codigo', c); } catch (e) { /* sin memoria local */ } };

  // Entrada: Mesero (código del negocio + su nombre) o Administrador (correo y contraseña).
  function pantallaEntrar(modo) {
    modo = modo || 'mesero';
    const tabs = h('div', { class: 'periodo', role: 'tablist', 'aria-label': 'Tipo de acceso', style: 'grid-template-columns:repeat(2,minmax(0,1fr))' },
      [['mesero', 'Mesero'], ['admin', 'Administrador']].map(([k, t]) => h('button', { type: 'button', role: 'tab', 'aria-selected': String(k === modo), class: k === modo ? 'on' : '', onclick: () => pantallaEntrar(k) }, t)));
    let caja;
    if (modo === 'admin') {
      const correo = h('input', { type: 'email', name: 'correo', autocomplete: 'username', required: true });
      const clave = h('input', { type: 'password', name: 'clave', autocomplete: 'current-password', required: true });
      caja = h('form', { class: 'caja', onsubmit: async (ev) => {
        ev.preventDefault();
        try { await PB.datos.entrar(correo.value.trim(), clave.value); PB.estado.perfil = null; ruta(); }
        catch (e) { aviso('No se pudo entrar: ' + e.message, 'mal'); }
      } }, campo('Correo', correo), campo('Contraseña', clave), h('button', { class: 'btn' }, 'Entrar'));
    } else {
      const cod = h('input', { name: 'codigo', inputmode: 'numeric', autocomplete: 'off', maxlength: '6', placeholder: '000000', value: leerCodigo(), style: 'font-size:24px;letter-spacing:.3em;text-align:center' });
      caja = h('form', { class: 'caja', onsubmit: async (ev) => {
        ev.preventDefault();
        const c = cod.value.replace(/\D/g, '');
        if (c.length !== 6) return aviso('El código tiene 6 números', 'mal');
        try {
          if (!(await PB.datos.usuario())) await PB.datos.entrarSinCorreo();
          const meseros = await PB.datos.rpc('meseros_para_elegir', { p_codigo: c });
          guardarCodigo(c);
          elegirMesero(c, meseros);
        } catch (e) { aviso(/incorrecto/i.test(e.message) ? 'Código incorrecto. Pídeselo al encargado.' : 'No se pudo: ' + e.message, 'mal'); }
      } }, h('p', {}, 'Pon el código del negocio. Solo la primera vez en este celular.'), campo('Código', cod), h('button', { class: 'btn' }, 'Continuar'));
    }
    app.replaceChildren(encabezadoMarca(PB.config.subtitulo), h('main', {}, tabs, caja));
    if (modo === 'mesero' && PB.estado.autoCodigo && leerCodigo()) { PB.estado.autoCodigo = false; caja.requestSubmit(); }
  }

  function elegirMesero(codigo, meseros) {
    app.replaceChildren(encabezadoMarca('¿Quién eres?'), h('main', {},
      h('div', { class: 'tit' }, 'Toca tu nombre'),
      meseros.length ? h('div', { class: 'tiles', style: 'grid-template-columns:repeat(2,minmax(0,1fr))' }, meseros.map((m) =>
        h('button', { type: 'button', class: 'tile', style: 'align-items:center;justify-content:center;text-align:center', onclick: async () => {
          try { await PB.datos.rpc('activar_mesero', { p_codigo: codigo, p_mesero: m.id }); PB.estado.perfil = null; location.hash = ''; ruta(); }
          catch (e) { aviso('No se pudo: ' + e.message, 'mal'); }
        } }, h('span', { class: 'foto mono', style: 'width:52px;height:52px;border-radius:26px;font-size:20px' }, m.nombre.slice(0, 1).toUpperCase()), h('b', { style: 'font-size:16px' }, m.nombre))))
        : h('p', { class: 'vacio' }, 'Aún no hay meseros dados de alta. Pídele al encargado que te agregue.'),
      h('button', { class: 'btn sec', style: 'margin-top:16px', type: 'button', onclick: () => pantallaEntrar('mesero') }, 'Volver')));
  }

  // Tarjeta «Ventas de hoy» con datos reales (solo dueño/encargado).
  async function tarjetaHoy(cont) {
    try {
      const V = PB.reglasVentas, P = PB.reglasPedidos, dia = PB.ui.hoy();
      const [pedidos, estados, cobros] = await Promise.all([PB.datos.listar('pedidos'), PB.datos.listar('pedido_estados'), PB.datos.listar('cobros')]);
      const validos = V.validos(pedidos, estados);
      const porCobrar = PB.reglasCuentas ? PB.reglasCuentas.suma(PB.reglasCuentas.pendientes(pedidos, estados, cobros)) : 0;
      const hoyP = V.enRango(validos, V.rango('hoy', dia)), ayerT = V.total(V.enRango(validos, V.rango('ayer', dia)));
      const total = V.total(hoyP), c = V.cambio(total, ayerT);
      cont.replaceChildren(
        h('div', { class: 'hoy-top' }, h('div', {}, h('span', {}, 'Ventas de hoy'), h('b', { class: 'num' }, dineroCorto(total))),
          h('span', { class: 'pill ' + (c == null ? 'neutro' : c >= 0 ? 'sube' : 'baja') }, c == null ? 'Sin datos de ayer' : `${c >= 0 ? '▲' : '▼'} ${Math.abs(c)}% vs. ayer`)),
        h('div', { class: 'stats' },
          // Pedidos: abre la lista de pedidos (Ventas). Por cobrar: lo que deben las mesas abiertas (abre Cuenta de mesa).
          h('a', { class: 'stat-link', href: '#/ventas', onclick: () => { try { sessionStorage.setItem('pb_ver_pedidos', '1'); } catch (e) { /* nada */ } } }, h('span', {}, 'Pedidos'), h('b', {}, String(hoyP.length))),
          h('a', { class: 'stat-link', href: '#/cuentas' }, h('span', {}, 'Por cobrar'), h('b', {}, dineroCorto(porCobrar))),

  // Mesero: mitad «En cocina» (naranja) y mitad «Preparados» hoy (verde azulado).
  async function tarjetaMesero(cont) {
    const { h, icono } = PB.ui;
    const P = PB.reglasPedidos, dia = PB.ui.hoy(), uid = (PB.estado.perfil || {}).id;
    try {
      const [pedidos, estados] = await Promise.all([PB.datos.listar('pedidos'), PB.datos.listar('pedido_estados')]);
      const fecha = (iso) => (PB.reglasVentas ? PB.reglasVentas.fechaLocal(iso) : String(iso).slice(0, 10));
      const enCocina = P.abiertos(pedidos, estados).length;
      const listos = P.listosDe(pedidos, estados, uid).filter((p) => fecha(p.creado_en) === dia); // preparados hoy (servir = tocar el aviso)
      const donde = (p) => (p.tipo === 'mesa' ? 'Mesa ' + p.referencia : p.tipo === 'llevar' ? 'Para llevar' : p.referencia) + (p.cliente ? ' · ' + p.cliente : '');
      cont.replaceChildren(h('div', { class: 'mitades' },
        h('a', { class: 'mitad cocina' + (enCocina ? ' con' : ''), href: '#/cocina', 'aria-label': `En cocina: ${enCocina}` }, h('span', {}, 'En cocina'), h('b', {}, String(enCocina))),
        h('div', { class: 'mitad listos', 'aria-label': `Preparados hoy: ${listos.length}` }, h('span', {}, 'Preparados'), h('b', {}, String(listos.length)))));
    } catch (e) { cont.replaceChildren(h('span', { class: 'nota' }, 'Sin datos todavía.')); }
  }

            h('summary', {}, h('span', {}, 'Administrar'), icono('abajo', 22)),
            h('div', { class: 'tiles' }, botones.filter((p) => p.ruta !== 'cocina').map((p, n) => h('a', { class: 'tile', href: '#/' + p.ruta },
              h('span', { class: TONO[n % 3] }, icono(IC[p.ruta] || 'menu')), h('b', {}, CORTO[p.ruta] || p.titulo)))));
          d.addEventListener('toggle', () => { try { localStorage.setItem('pb_admin_abierto', d.open ? '1' : '0'); } catch (e) { /* nada */ } });
          return d;
        })() : null,
        esAdmin() ? h('button', { class: 'btn sec', style: 'margin-top:20px', type: 'button', onclick: () => { ponerVista(true); inicio(); scrollTo(0, 0); } }, icono('equipo'), 'Ver como mesero') : null,
        h('button', { class: 'btn sec', style: 'margin-top:10px', type: 'button', onclick: async () => { await PB.datos.salir(); clearInterval(vigia); PB.estado.perfil = null; ponerVista(false); location.hash = ''; ruta(); } }, icono('salir'), esAdminReal() ? 'Salir' : 'Cambiar de mesero'),
        h('p', { class: 'nota', style: 'text-align:center' }, 'Versión ' + PB.config.version))].filter(Boolean));
    if (admin) tarjetaHoy(hoyCaja); else tarjetaMesero(meseroCaja);
    // Cuántos pedidos hay en cocina (para todos).
    Promise.all([PB.datos.listar('pedidos'), PB.datos.listar('pedido_estados')]).then(([ped, est]) => {
      const ab = PB.reglasPedidos.abiertos(ped, est), n = ab.length;
      const nuevos = ab.filter((p) => PB.reglasPedidos.estadoActual(p.id, est) === 'nuevo').length;
      const sub = app.querySelector('.cocina-sub');
      if (sub) sub.textContent = n ? `${n} en cocina${nuevos ? ` · ${nuevos} sin empezar` : ''}` : 'Sin pedidos pendientes';
    }).catch(() => {});
  }

  // Aviso al mesero: cuando cocina marca «Listo» un pedido suyo, pita 4 veces, vibra y sale el aviso.
  let vigia = null;
  function avisarListo(p) {
    const donde = p.tipo === 'mesa' ? 'Mesa ' + p.referencia : p.tipo === 'llevar' ? 'Para llevar' + (p.referencia ? ' · ' + p.referencia : '') : p.referencia;
    PB.ui.sonar(4);
    try { if (g.Notification && Notification.permission === 'granted') new Notification('Pedido listo', { body: `#${p.folio} · ${donde}`, icon: 'icono-192.png', tag: 'listo-' + p.id }); } catch (e) { /* sin notificación */ }
    const b = h('button', { type: 'button', class: 'listo-aviso', onclick: () => b.remove() }, icono('campana', 28),
      h('span', {}, h('b', {}, `¡Pedido #${p.folio} listo!`), h('span', {}, donde + ' · toca para cerrar')));
    document.body.append(b);
  }
  function vigilarListos() {
    clearInterval(vigia);
    const uid = (PB.estado.perfil || {}).id;
    if (!uid) return;
    let vistos = null;
    const revisar = async () => {
      try {
        const [pedidos, estados] = await Promise.all([PB.datos.listar('pedidos'), PB.datos.listar('pedido_estados')]);
        const listos = PB.reglasPedidos.listosDe(pedidos, estados, uid);
        if (vistos) listos.filter((p) => !vistos.has(p.id)).forEach(avisarListo);
        vistos = new Set(listos.map((p) => p.id));
        const caja = document.querySelector('.mesero-caja'); if (caja) tarjetaMesero(caja); // se actualiza sola
      } catch (e) { /* sin red: se intenta en la siguiente vuelta */ }
    };
    revisar();
    vigia = setInterval(revisar, g.__INTERVALO_AVISO__ || 10000);
  }
  document.addEventListener('pointerdown', () => { try { PB._audio = PB._audio || new (g.AudioContext || g.webkitAudioContext)(); } catch (e) { /* nada */ } }, { once: true });

  async function ruta() {
    if (!(await PB.datos.usuario())) return pantallaEntrar();
    if (!PB.estado.perfil) { PB.estado.perfil = await PB.datos.perfil(); if (PB.estado.perfil) vigilarListos(); }
    if (!PB.estado.perfil) {
      // Sesión sin permiso: celular de mesero sin activar, o cuenta sin permiso.
      if (await PB.datos.esSinCorreo()) {
        const c = leerCodigo();
        if (c) { try { return elegirMesero(c, await PB.datos.rpc('meseros_para_elegir', { p_codigo: c })); } catch (e) { /* código cambió */ } }
        return pantallaEntrar('mesero');
      }
      await PB.datos.salir();
      aviso('Esta cuenta no tiene permiso. Pídeselo al dueño.', 'mal');
      return pantallaEntrar('admin');
    }
    const nombre = location.hash.replace('#/', '') || 'inicio';
    const p = PB.pantallas[nombre];
    document.body.className = '';
    try {
      if (p && puede(p)) await p.mostrar(app);
      else { if (p) location.hash = ''; inicio(); }
      scrollTo(0, 0);
    } catch (e) { aviso('Error: ' + e.message, 'mal'); }
  }

  // Enlace del mesero (?codigo=123456): guarda el código y entra directo a elegir su nombre.
  try {
    const cUrl = new URLSearchParams(location.search).get('codigo');
    if (/^\d{6}$/.test(cUrl || '')) { guardarCodigo(cUrl); PB.estado.autoCodigo = true; history.replaceState(null, '', location.pathname + location.hash); }
  } catch (e) { /* sin enlace */ }
  PB.tema.iniciar();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!g.__REPO_FALSO__ && !claveAnon()) { pantallaClave(); return; }
  PB.datos.iniciar(PB.config.supabaseUrl, claveAnon());
  addEventListener('hashchange', ruta);
  ruta();
})(window);
</script>
</body></html>
